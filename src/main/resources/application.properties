server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never

spring.datasource.url=jdbc:h2:mem:learncrypto;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# H2 web console stays off; enable it with the "local" profile only.
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info

spring.cache.type=caffeine
spring.cache.cache-names=markets
spring.cache.caffeine.spec=expireAfterWrite=90s

# CoinGecko market data (public API; optional demo key adds the x-cg-demo-api-key header)
coingecko.base-url=${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
coingecko.api-key=${COINGECKO_API_KEY:}
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=6s
